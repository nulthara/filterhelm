[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "filterhelm"
dynamic = ["version"]
description = "Local GUI for managing multiple Pi-hole instances"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
    "pyyaml==6.0.3",
    "httpx==0.28.1",
    "keyring==25.7.0",
    "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.dynamic]
version = {attr = "app.__version__"}
